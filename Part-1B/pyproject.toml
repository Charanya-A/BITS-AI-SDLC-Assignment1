[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-message-spam-classifier"
version = "0.1.0"
description = "English customer message spam classification using TF-IDF and Multinomial Naive Bayes"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "jsonschema>=4.0,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "unit: unit tests",
    "contract: contract tests",
    "integration: integration tests",
]